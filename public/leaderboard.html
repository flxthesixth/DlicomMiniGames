<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#126cff">
<title>DILI RUN — GLOBAL LEADERBOARD</title>
<link rel="icon" href="/assets/dili-run-icon.jpg" type="image/jpeg">
<style>
:root{--blue:#126cff;--ink:#05070d;--paper:#f7f9ff;--muted:#9ca6bd;--line:#263047}*{box-sizing:border-box}html,body{min-height:100%;margin:0;background:var(--ink);color:var(--paper);font-family:Arial,Helvetica,sans-serif}body:before{content:'';position:fixed;inset:0;background:linear-gradient(#05070dd9,#05070dd9),url('./assets/dili-man-sky.webp') 50% 45%/cover no-repeat;z-index:0}.shell{position:relative;z-index:1;width:min(760px,100%);margin:auto;padding:24px 14px 48px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-bottom:18px;border-bottom:1px solid var(--line)}.mark{font-size:20px;font-weight:950;letter-spacing:-1.7px}.mark i{color:var(--blue);font-style:normal}.button{border:1px solid var(--blue);color:#fff;padding:10px 13px;font:900 11px monospace;letter-spacing:.08em;text-decoration:none;background:#05070d99}.button:hover,.button:focus-visible{background:var(--blue)}h1{margin:46px 0 8px;font-size:clamp(38px,8vw,72px);line-height:.9;letter-spacing:-.07em}h1 span{color:var(--blue)}.sub{margin:0 0 24px;color:var(--muted);font:700 11px monospace;letter-spacing:.12em}.panel{border:1px solid var(--line);background:#0a0e17e8;padding:18px}.scores{margin:0;padding:0;list-style:none;font:13px monospace}.scores li{display:grid;grid-template-columns:48px 1fr auto;gap:10px;padding:12px 0;border-bottom:1px solid #ffffff12}.scores li:last-child{border-bottom:0}.rank,.score{color:var(--blue);font-weight:900}.scores li:first-child .name{color:#fff;font-weight:900}.load{display:block;width:100%;margin-top:14px;cursor:pointer}.load[hidden]{display:none}@media(max-width:520px){.scores li{grid-template-columns:38px 1fr auto;font-size:12px}h1{margin-top:34px}}
</style>
</head>
<body><div class="shell"><header class="top"><div class="mark">DILI<i>◆</i>RUN</div><a class="button" href="/game.html">BACK TO RUN</a></header><main><h1>GLOBAL<br><span>LEADERBOARD</span></h1><p class="sub">ALL RUNNERS · BEST SCORES</p><section class="panel"><ol id="scores" class="scores"><li><span>—</span><span>LOADING</span><span>—</span></li></ol><button class="button load" id="loadMore">LOAD MORE</button></section></main></div><script>
const list=document.querySelector('#scores'),button=document.querySelector('#loadMore');let offset=0;
async function load(){button.disabled=true;try{const r=await fetch(`/api/scores?limit=50&offset=${offset}`);if(!r.ok)throw Error('request_failed');const {scores=[]}=await r.json();if(offset===0)list.innerHTML='';list.insertAdjacentHTML('beforeend',scores.map((x,i)=>`<li><span class="rank">${offset+i+1}</span><span class="name">@${x.username}</span><span class="score">${String(x.score).padStart(5,'0')}</span></li>`).join(''));offset+=scores.length;button.hidden=scores.length<50;if(!offset)list.innerHTML='<li><span>—</span><span>NO SCORES YET</span><span>—</span></li>'}catch(e){if(!offset)list.innerHTML='<li><span>—</span><span>FAILED TO LOAD</span><span>—</span></li>'}finally{button.disabled=false}}
button.onclick=load;load();
</script></body></html>
