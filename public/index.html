<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DLICOM RUNNER — ACCESS</title>
<style>
:root{--ink:#05070d;--paper:#f5f7ff;--blue:#126cff;--line:#27324a;--muted:#a9b4ca}*{box-sizing:border-box}html,body{min-height:100%;margin:0}body{min-height:100vh;overflow:hidden;background:var(--ink);color:var(--paper);font-family:Arial,Helvetica,sans-serif}.page{isolation:isolate;position:relative;min-height:100vh;display:grid;place-items:center;padding:24px}.silhouette{position:absolute;z-index:-1;width:min(960px,125vw);height:min(960px,125vw);object-fit:contain;filter:brightness(0) contrast(1.3) drop-shadow(0 0 2px #5a6b8e) drop-shadow(0 0 18px #18213a);opacity:.9;right:max(-13vw,calc(50% - 650px));bottom:-20vh;pointer-events:none;user-select:none}.grain{position:absolute;inset:0;z-index:-1;opacity:.17;background:repeating-linear-gradient(90deg,#fff0 0 3px,#fff 3px 4px);mix-blend-mode:soft-light;pointer-events:none}.gate{width:min(100%,470px);border:1px solid var(--line);background:rgba(5,7,13,.94);padding:28px;box-shadow:12px 12px 0 #126cff}.mark{font:900 13px monospace;letter-spacing:.12em}.mark i{color:var(--blue);font-style:normal}.kicker{margin:66px 0 12px;color:var(--blue);font:900 11px monospace;letter-spacing:.16em}.gate h1{margin:0;font-size:clamp(48px,10vw,76px);line-height:.82;letter-spacing:-.095em}.gate h1 span{color:var(--blue)}.copy{max-width:320px;margin:24px 0 30px;color:var(--muted);font-size:14px;line-height:1.45}.choice{display:block;width:100%;min-height:52px;border:2px solid var(--blue);background:var(--blue);color:#fff;text-align:center;text-decoration:none;font:900 12px monospace;letter-spacing:.09em;line-height:48px;cursor:pointer}.choice:hover{background:#0d58d0}.divider{display:flex;align-items:center;gap:12px;margin:24px 0;color:var(--muted);font:900 10px monospace;letter-spacing:.12em}.divider:before,.divider:after{content:'';height:1px;flex:1;background:var(--line)}.guest{display:grid;gap:10px}.guest label{font:900 11px monospace;letter-spacing:.09em}.guest input{width:100%;height:50px;border:1px solid var(--line);border-radius:0;background:#0b1020;color:#fff;padding:0 13px;font:700 15px Arial;outline:none}.guest input:focus{border-color:var(--blue)}.guest button{min-height:50px;border:1px solid var(--paper);border-radius:0;background:transparent;color:var(--paper);font:900 12px monospace;letter-spacing:.09em;cursor:pointer}.guest button:hover{background:#fff;color:#05070d}.error{min-height:17px;margin:3px 0 0;color:#ff7489;font:700 11px monospace}.foot{position:absolute;bottom:20px;left:24px;font:900 10px monospace;letter-spacing:.08em;color:#6f7a91}@media(max-width:540px){.gate{padding:24px;box-shadow:7px 7px 0 var(--blue)}.silhouette{width:130vw;height:130vw;right:-45vw;bottom:-10vh}.kicker{margin-top:45px}}
</style>
</head>
<body><main class="page"><img class="silhouette" src="/assets/login-silhouette.png" alt="" aria-hidden="true"><div class="grain"></div><section class="gate" aria-labelledby="title"><div class="mark">DLICOM<i>◆</i>RUNNER</div><p class="kicker">IDENTITY CHECK / 01</p><h1 id="title">RUN<br>AS <span>DILI.</span></h1><p class="copy">Choose a public identity. Your name appears on the global leaderboard.</p><a class="choice" href="/auth/x">LOG IN WITH X</a><div class="divider">OR</div><form class="guest" method="post" action="/auth/guest"><label for="guestName">ENTER A RUNNER NAME</label><input id="guestName" name="name" maxlength="24" autocomplete="nickname" placeholder="e.g. DILI_01" required pattern="[A-Za-z0-9_ .-]{2,24}"><button type="submit">CONTINUE AS GUEST</button><p class="error" id="error" aria-live="polite"></p></form></section><footer class="foot">DLICOM RUNNER BY FLX · PLAY FIRST, POST THEN.</footer></main><script>const e=new URLSearchParams(location.search).get('error');if(e)document.querySelector('#error').textContent=e==='name'?'Use 2–24 letters, numbers, spaces, _ or -':'Login failed. Try again.';</script></body></html>
